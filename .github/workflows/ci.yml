name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F91 --show-source --statistics
    
    - name: Check formatting with black
      run: |
        black --check .
    
    - name: Type check with mypy
      run: |
        mypy api/app --ignore-missing-imports
    
    - name: Test with pytest
      run: |
        pytest api/tests/ -v --cov=api/app --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t discord-exporter:${{ github.sha }} .
    
    - name: Run container health check
      run: |
        docker run -d --name test-app -p 8000:8000 discord-exporter:${{ github.sha }}
        sleep 5
        docker exec test-app curl -f http://localhost:8000/api/v1/health
        docker stop test-app
